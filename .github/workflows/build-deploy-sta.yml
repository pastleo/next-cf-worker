name: Build & deploy sta

on:
  push:
    tags: ['sta/**']
    branches: ['main']

jobs:
  build-deploy-sta:
    name: Build & deploy sta
    runs-on: ubuntu-latest
    env:
      BUILD_ENV: sta
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v3
        with:
          node-version: '24.0.2'
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm cf:build

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: 'pastleo'
          workload_identity_provider: 'projects/744959125566/locations/global/workloadIdentityPools/github/providers/next-cf-worker-oidc-provider'

      - id: 'secrets'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            cfAccountId:projects/744959125566/secrets/pastleo-next-cf-worker-cf-account-id
            cfApiToken:projects/744959125566/secrets/pastleo-next-cf-worker-cf-api-token

      - if: github.ref_type == 'branch'
        run: pnpm wrangler deploy --env=$BUILD_ENV
        env:
          CLOUDFLARE_ACCOUNT_ID: '${{ steps.secrets.outputs.cfAccountId }}'
          CLOUDFLARE_API_TOKEN: '${{ steps.secrets.outputs.cfApiToken }}'
      - if: github.ref_type == 'tag'
        run: |
          PREVIEW_ALIAS=$(echo $GITHUB_REF_NAME | cut -d'/' -f2)
          pnpm wrangler versions upload --env=$BUILD_ENV --preview-alias=$PREVIEW_ALIAS
        env:
          CLOUDFLARE_ACCOUNT_ID: '${{ steps.secrets.outputs.cfAccountId }}'
          CLOUDFLARE_API_TOKEN: '${{ steps.secrets.outputs.cfApiToken }}'
